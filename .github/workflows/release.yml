name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Validate release tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Release tags must use SemVer with a v prefix, for example v1.0.0."
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore DualSenseBatteryTray.sln --runtime win-x64

      - name: Test
        run: dotnet test DualSenseBatteryTray.sln --configuration Release --no-restore

      - name: Publish App
        shell: pwsh
        run: |
          dotnet publish src/DualSenseBatteryTray.App/DualSenseBatteryTray.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=${{ steps.version.outputs.version }} `
            --output "$env:RUNNER_TEMP\app-publish"

      - name: Publish Watcher
        shell: pwsh
        run: |
          dotnet publish src/DualSenseBatteryTray.Watcher/DualSenseBatteryTray.Watcher.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=${{ steps.version.outputs.version }} `
            --output "$env:RUNNER_TEMP\watcher-publish"

      - name: Assemble release archive
        id: package
        shell: pwsh
        run: |
          $archiveBase = "DualSenseBatteryTray-$env:GITHUB_REF_NAME-win-x64"
          $packageRoot = Join-Path $env:RUNNER_TEMP $archiveBase
          $payload = Join-Path $packageRoot 'publish'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null

          Copy-Item "$env:RUNNER_TEMP\app-publish\DualSenseBatteryTray.App.exe" $payload
          Copy-Item "$env:RUNNER_TEMP\watcher-publish\DualSenseBatteryTray.Watcher.exe" $payload
          Copy-Item scripts\install.ps1, scripts\uninstall.ps1, scripts\device-watcher-task.xml $packageRoot
          Copy-Item README.md $packageRoot
          Copy-Item LICENSES $packageRoot -Recurse

          $archive = Join-Path $env:GITHUB_WORKSPACE "$archiveBase.zip"
          Compress-Archive -Path "$packageRoot\*" -DestinationPath $archive -CompressionLevel Optimal
          $checksum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $archiveBase.zip" | Set-Content `
            -LiteralPath "$archive.sha256" `
            -Encoding ascii `
            -NoNewline

          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$archive.sha256" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            '${{ steps.package.outputs.archive }}' `
            '${{ steps.package.outputs.checksum }}' `
            --verify-tag `
            --title "DualSense Battery Tray $env:GITHUB_REF_NAME" `
            --generate-notes
